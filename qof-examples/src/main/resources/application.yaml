server:
  port: 10086

spring:
  application:
    name: qof-examples
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://127.0.0.1:3306/file?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF8&useSSL=false&allowMultiQueries=true
    username: root
    password: root

# 主路径演示：Local + MySQL 元数据 + 内置 HTTP
# 建表见 qof-spring-boot-starter-persistence-mysql/examples/schema.sql
qof:
  web:
    enabled: true
    expose-advice: true
    base-path: /file
  local:
    enable: true
    default-storage-station: c-station
    multiple:
      c-station:
        filepath: ./files/c
      d-station:
        filepath: ./files/d
