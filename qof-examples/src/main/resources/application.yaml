server:
  port: 10086

spring:
  application:
    name: qof-examples
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
#    # 默认使用 Spring Boot 内置 HikariCP，无需指定 type
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}/mall?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF8&useSSL=false&allowMultiQueries=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
#  data:
#    mongodb:
#      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:27017/qof?authSource=admin

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 主路径演示：Local + MySQL 元数据 + 内置 HTTP
# 建表见 qof-persistence-mysql/examples/schema.sql
qof:
  web:
    enabled: true
    expose-advice: true
    base-path: /file
  local:
    enable: true
    default-storage-station: c-station
    multiple:
      c-station:
        filepath: ./files/c
      d-station:
        filepath: ./files/d
  cos:
    enable: true
    default-storage-station: c-station
    multiple:
      c-station:
        region: ap-guangzhou
        bucket-name: qof-1306969108
        access-key: ${COS_SECRET_ID}
        secret-key: ${COS_SECRET_KEY}
        filepath: /qof-c
      d-station:
        region: ap-guangzhou
        bucket-name: qof-1306969108
        access-key: ${COS_SECRET_ID}
        secret-key: ${COS_SECRET_KEY}
        filepath: /qof-d
  s3:
    enable: true
    multiple:
      c-station:
        endpoint: ${S3_ENDPOINT}
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
        bucket-name: qof
        filepath: /qof-c
        